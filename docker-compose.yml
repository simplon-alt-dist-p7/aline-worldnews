services:
  db:
    image: postgres:15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./wn-rajar-ms_reader/Db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  writer-back:
    build: ./wm-rajar-ms_writer/BACK
    container_name: writer-back
    ports:
      - "5000:5000"
    env_file:
      - ./wm-rajar-ms_writer/BACK/.env
    depends_on:
      db:
        condition: service_healthy
    command: npm start

  reader-back:
    build: ./wn-rajar-ms_reader/Backend
    container_name: reader-back
    ports:
      - "5001:5001"
    env_file: ./wn-rajar-ms_reader/Backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: npm start

  writer-front:
    build: ./wm-rajar-ms_writer/FRONT
    ports:
      - "5174:5174"
    depends_on:
      - writer-back
    command: ["npx", "vite", "dev", "--host", "0.0.0.0", "--port", "5174"]

  reader-front:
    build: ./wn-rajar-ms_reader/Frontend
    ports:
      - "5175:5175"
    depends_on:
      - reader-back
    command: ["npx", "vite", "dev", "--host", "0.0.0.0", "--port", "5175"]

volumes:
  pgdata:
