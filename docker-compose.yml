services:
  db:
    image: postgres:15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    env_file:
    - ./database/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  writer-back:
    build: ./writer/backend
    container_name: writer-back
    ports:
      - "5000:5000"
    env_file:
      - ./writer/backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: npm start

  reader-back:
    build: ./reader/backend
    container_name: reader-back
    ports:
      - "5001:5001"
    env_file: ./reader/backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: npm start

  writer-front:
    build: ./writer/frontend
    ports:
      - "5174:5174"
    depends_on:
      - writer-back

  reader-front:
    build: ./reader/frontend
    ports:
      - "5175:5175"
    depends_on:
      - reader-back

volumes:
  pgdata:
