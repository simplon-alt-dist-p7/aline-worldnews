pre-commit:
  parallel: true
  commands:
    eslint-writer-back:
      glob: '*.{ts,js}'
      root: 'writer/backend/'
      run: npx eslint --fix {staged_files} && git add {staged_files}

    eslint-writer-front:
      glob: '*.{ts,tsx,js,jsx}'
      root: 'writer/frontend/'
      run: npx eslint --fix {staged_files} && git add {staged_files}

    eslint-reader-back:
      glob: '*.{ts,js}'
      root: 'reader/backend/'
      run: npx eslint --fix {staged_files} && git add {staged_files}

    eslint-reader-front:
      glob: '*.{ts,tsx,js,jsx}'
      root: 'reader/frontend/'
      run: npx eslint --fix {staged_files} && git add {staged_files}

    prettier-writer-back:
      glob: '*.{ts,js,json,md}'
      root: 'writer/backend/'
      run: npx prettier --write {staged_files} && git add {staged_files}

    prettier-writer-front:
      glob: '*.{ts,tsx,js,jsx,css,json,md}'
      root: 'writer/frontend/'
      run: npx prettier --write {staged_files} && git add {staged_files}

    prettier-reader-back:
      glob: '*.{ts,js,json,md}'
      root: 'reader/backend/'
      run: npx prettier --write {staged_files} && git add {staged_files}

    prettier-reader-front:
      glob: '*.{ts,tsx,js,jsx,css,json,md}'
      root: 'reader/frontend/'
      run: npx prettier --write {staged_files} && git add {staged_files}

pre-push:
  commands:
    typecheck-writer-back:
      run: cd writer/backend && npx tsc --noEmit

    typecheck-writer-front:
      run: cd writer/frontend && npx tsc --noEmit

    typecheck-reader-back:
      run: cd reader/backend && npx tsc --noEmit

    typecheck-reader-front:
      run: cd reader/frontend && npx tsc --noEmit

    test-writer-back:
      run: cd writer/backend && npx jest --passWithNoTests

    test-writer-front:
      run: cd writer/frontend && npx vitest run --passWithNoTests

    test-reader-back:
      run: cd reader/backend && npx jest --passWithNoTests

    test-reader-front:
      run: cd reader/frontend && npx vitest run --passWithNoTests

    test-e2e:
      run: cd writer/frontend && npx playwright test
