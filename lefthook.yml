pre-commit:
  parallel: true
  commands:
    format-writer-back:
      run: npx prettier --write "wm-rajar-ms_writer\BACK/src/**/*.{ts,tsx,js,jsx,json,css,scss,md}"
    format-writer-front:
      run: npx prettier --write "wm-rajar-ms_writer\FRONT/src/**/*.{ts,tsx,js,jsx,json,css,scss,md}"
    format-reader-back:
      run: npx prettier --write "wn-rajar-ms_reader\Backend/src/**/*.{ts,tsx,js,jsx,json,css,scss,md}"
    format-reader-front:
      run: npx prettier --write "wn-rajar-ms_reader\Frontend/src/**/*.{ts,tsx,js,jsx,json,css,scss,md}"

pre-push:
  parallel: true
  commands:
    test-writer-back:
      run: cd wm-rajar-ms_writer\BACK && npm test
    test-writer-front:
      run: cd wm-rajar-ms_writer\FRONT && npm test
    test-reader-back:
      run: cd wn-rajar-ms_reader\Backend && npm test
    test-reader-front:
      run: cd wn-rajar-ms_reader\Frontend && npm test
