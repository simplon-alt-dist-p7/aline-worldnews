# 1. Quand est-ce que le pipeline se déclenche ?
# on : à chaque push sur main et à chaque pull request vers main.
#2. Sur quel système ça tourne ?
# runs-on: On choisit ubuntu-latest parce que c'est gratuit sur GitHub Actions et que le code tourne sous Linux en production (Docker).
#3. Quels sont les jobs ?
# job = une tâche indépendante. ici 4 services donc 4 jobs qui tournent en parallèle.
#4. Quelles sont les étapes de chaque job ?
# steps: Pour chaque service Node.js c'est toujours la même logique :

#Récupérer le code (checkout)
#Installer Node (setup-node)
#Installer les dépendances (npm ci)
#Lancer le lint (npm run lint)
#Lancer les tests (npm test)

name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  reader-back:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready 
          --health-interval 2s 
          --health-timeout 2s 
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/test_db
      NODE_ENV: test
    defaults:
      run:
        working-directory: reader/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: reader/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Initialiser la base de données
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d test_db -f $GITHUB_WORKSPACE/database/01-worldnews.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d test_db -f $GITHUB_WORKSPACE/database/04-categories.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d test_db -f $GITHUB_WORKSPACE/database/02-seed.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d test_db -f $GITHUB_WORKSPACE/database/03-seed-comments.sql
      - run: npm run lint
      - run: npm test

  reader-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: reader/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  writer-back:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: writer
      PORT: 5000
      NODE_ENV: test
      GEMINI_API_KEY: dummy
      FRONTEND_URL: http://localhost:5174
    defaults:
      run:
        working-directory: writer/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: writer/backend/package-lock.json
      - run: npm ci
      - name: Initialiser la base de données
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d test_db -f $GITHUB_WORKSPACE/database/01-worldnews.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d test_db -f $GITHUB_WORKSPACE/database/04-categories.sql
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d test_db -f $GITHUB_WORKSPACE/database/02-seed.sql
      - run: npm run lint
      - run: npm test

  writer-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: writer/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: writer/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
