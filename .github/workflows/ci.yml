# 1. Quand est-ce que le pipeline se déclenche ?
# on : à chaque push sur main et à chaque pull request vers main.
#2. Sur quel système ça tourne ?
# runs-on: On choisit ubuntu-latest parce que c'est gratuit sur GitHub Actions et que le code tourne sous Linux en production (Docker).
#3. Quels sont les jobs ?
# job = une tâche indépendante. ici 4 services donc 4 jobs qui tournent en parallèle.
#4. Quelles sont les étapes de chaque job ?
# steps: Pour chaque service Node.js c'est toujours la même logique :

#Récupérer le code (checkout)
#Installer Node (setup-node)
#Installer les dépendances (npm ci)
#Lancer le lint (npm run lint)
#Lancer les tests (npm test)

name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  reader-back:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready #commande qui vérifie si Postgres accepte des connexions
          --health-interval 2s #vérifie toutes les 2 secondes
          --health-timeout 2s #chaque vérification a 2 secondes pour répondre
          --health-retries 10 #si ça échoue 10 fois de suite, considère que Postgres n'a pas démarré
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/test_db
      NODE_ENV: test
    defaults:
      run:
        working-directory: wn-rajar-ms_reader/Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: wn-rajar-ms_reader/Backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test

  reader-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wn-rajar-ms_reader/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: wn-rajar-ms_reader/Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  writer-back:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: worldnews
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: worldnews
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: writer
      PORT: 5000
      NODE_ENV: test
      GEMINI_API_KEY: dummy
      FRONTEND_URL: http://localhost:5174
    defaults:
      run:
        working-directory: wm-rajar-ms_writer/BACK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: wm-rajar-ms_writer/BACK/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  writer-front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wm-rajar-ms_writer/FRONT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: wm-rajar-ms_writer/FRONT/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
